[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eversolo-scrobbler"
version = "0.1.0"
description = "A lightweight Last.fm scrobbling daemon for Eversolo streamers"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["aiohttp>=3.9,<4"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[project.scripts]
eversolo-scrobbler = "eversolo_scrobbler.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

